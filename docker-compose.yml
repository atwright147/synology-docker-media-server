# FROM: https://github.com/sebgl/htpc-download-box/blob/master/docker-compose.yml

version: "3"
services:
  vpn:
    image: qmcgaw/gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    hostname: gluetun
    environment:
      # - VPN_SERVICE_PROVIDER=nordvpn
      # - OPENVPN_USER=${NORD_SERVICE_USER}
      # - OPENVPN_PASSWORD=${NORD_SERVICE_PASS}
      # - SERVER_COUNTRIES=Netherlands
      # - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING}
      - VPN_PORT_FORWARDING_PROVIDER=${VPN_PORT_FORWARDING_PROVIDER}
      - PORT_FORWARD_ONLY=${PORT_FORWARD_ONLY}
      - VPN_PORT_FORWARDING_SCRIPT=/scripts/update-port-forward.sh
      - QB_USERNAME=${QB_USERNAME:-admin}
      - QB_PASSWORD=${QB_PASSWORD:-adminadmin}
    volumes:
      - /${BASE_PATH}/docker/media-server/scripts:/scripts
    ports:
      # - 9117:9117  # Jackett
      # - 9696:9696  # Prowlarr
      # - 7878:7878  # Radarr
      # - 8686:8686  # Lidarr
      # - 8787:8787  # Readerr
      # - 8989:8989  # Sonarr
      # - 8191:8191  # FlareSolverr
      # qBitTorrent
      - 6881:6881
      - 6881:6881/udp
      - 8080:8080

  jackett:
    container_name: jackett
    image: linuxserver/jackett:latest
    restart: unless-stopped
    ports:
      - 9117:9117
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /${BASE_PATH}/Downloads/Torrents/torrent-blackhole:/downloads # place where to put .torrent files
      - /${BASE_PATH}/docker/media-server/.config/jackett:/config

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - 9696:9696
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /${BASE_PATH}/docker/media-server/.config/prowlarr:/config

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    ports:
      - 8191:8191
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      vpn:
        condition: service_healthy
    network_mode: service:vpn
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - UMASK_SET=022
      - WEBUI_PORT=8080
    volumes:
      - /${BASE_PATH}/docker/media-server/.config/qbittorrent:/config
      - /${BASE_PATH}/Downloads/Torrents:/downloads

  # caddy:
  #   build:
  #     context: ./caddy
  #     dockerfile: Dockerfile
  #   container_name: caddy
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #     - "8443:8443"
  #   environment:
  #     - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
  #   volumes:
  #     - /${BASE_PATH}/docker/media-server/.config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - /${BASE_PATH}/docker/media-server/.config/caddy/data:/data
  #     - /${BASE_PATH}/docker/media-server/.config/caddy/config:/config
  #   networks:
  #     - proxy-network

  sonarr:
    container_name: sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    ports:
      - 8989:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /${BASE_PATH}/docker/media-server/.config/sonarr:/config
      - /${BASE_PATH}/docker/media-server/scripts:/scripts
      - /${BASE_PATH}/TV:/tv
      - /${BASE_PATH}/Downloads/Torrents:/downloads
    networks:
      - proxy-network

  radarr:
    container_name: radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - 7878:7878
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /${BASE_PATH}/docker/media-server/.config/radarr:/config
      - /${BASE_PATH}/docker/media-server/scripts:/scripts
      - /${BASE_PATH}/Movies:/movies
      - /${BASE_PATH}/Downloads/Torrents:/downloads
    networks:
      - proxy-network

  # readarr:
  #   container_name: readarr
  #   image: linuxserver/readarr:develop
  #   restart: unless-stopped
  #   ports:
  #     - 8787:8787
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TIMEZONE}
  #   volumes:
  #     - /${BASE_PATH}/docker/media-server/.config/readarr:/config
  #     - /${BASE_PATH}/Books:/books
  #     - /${BASE_PATH}/Downloads/Books:/downloads
      
  # lidarr:
  #   container_name: lidarr
  #   image: linuxserver/lidarr:latest
  #   restart: unless-stopped
  #   ports:
  #     - 8686:8686
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TIMEZONE}
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #     - /${BASE_PATH}/docker/media-server/.config/lidarr:/config
  #     - /${BASE_PATH}/Downloads/Music:/music
  #     - /${BASE_PATH}/Downloads/Torrents:/downloads

  bazarr:
    container_name: bazarr
    image: linuxserver/bazarr
    restart: unless-stopped
    ports:
      - 6767:6767
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /${BASE_PATH}/docker/media-server/.config/bazarr:/config
      - /${BASE_PATH}/Movies:/movies
      - /${BASE_PATH}/TV:/tv
      
  emby:
    image: linuxserver/emby:latest
    container_name: emby
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - /${BASE_PATH}/TV:/data/tvshows
      - /${BASE_PATH}/Movies:/data/movies
      - /${BASE_PATH}/docker/media-server/.config/emby:/config
    ports:
      - 8097:8096/tcp
      - 8096:8096/tcp

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - /${BASE_PATH}/docker/media-server/.config/cleanuparr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s        # Check every 30 seconds
      timeout: 10s         # Allow up to 10 seconds for response
      start_period: 30s    # Wait 30 seconds before first check
      retries: 3           # Mark unhealthy after 3 consecutive failures
      
  # sonarr_youtubedl:
  #   image: dungfu/sonarr_youtubedl
  #   container_name: sonarr_youtubedl
  #   volumes:
  #     - /${BASE_PATH}/docker/media-server/.config/sonarr_youtubedl:/config
  #     - /${BASE_PATH}/TV:/sonarr_root
  #     - /${BASE_PATH}/docker/media-server/.logs/sonarr_youtubedl:/logs
  #     - /${BASE_PATH}/docker/media-server/.config/sonarr_youtubedl/yt-dlp.conf:/etc/yt-dlp.conf:ro
  #   networks:
  #     - proxy-network

networks:
  proxy-network:
    driver: bridge
